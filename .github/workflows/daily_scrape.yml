name: G2B_Daily_Scraper

on:
  schedule:
    # 매일 한국 시간 오전 9시 (UTC 00:00)에 실행
    - cron: '0 0 * * *'
  workflow_dispatch:
    # 필요할 때 수동으로 버튼 눌러서 실행 가능

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 깃허브에 파일을 쓸 권한 허용

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Scraper
      run: python scraper_nara.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add g2b_feed.xml
        # 변경 사항이 있을 때만 커밋 (에러 방지)
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update G2B RSS Feed [$(date)]" && git push)
